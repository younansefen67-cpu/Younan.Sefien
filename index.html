<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>YOUNAN SEFIEN — معرض الأعمال</title>
 <div style="text-align: center; margin-bottom: 30px;">
    <a href="portfolio.html" style="background: #e4c17a; color: #0b0a10; padding: 10px 24px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 16px;">شاهد معرض الأعمال ➔</a>
</div>   <style>
        :root {
            --bg: #0b0a10;
            --card: #17141f;
            --gold: #e4c17a;
            --muted: #c2bec9;
            --line: rgba(228, 193, 122, .38);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Tahoma, "Segoe UI", sans-serif;
            color: #fff;
            background: radial-gradient(700px 480px at 15% 0%, #382b24 0%, transparent 68%),
                        radial-gradient(600px 420px at 95% 35%, #211a3b 0%, transparent 70%),
                        var(--bg);
            min-height: 100vh;
        }
        main {
            max-width: 900px;
            margin: auto;
            padding: 44px 20px 72px;
        }
        .top {
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin-bottom: 34px;
        }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: var(--gold); font-size: 30px; margin: 0 0 9px; }
        .tag { color: var(--muted); margin: 0; font-size: 15px; }
        
        /* Navigation Buttons */
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
        }
        .nav-btn {
            background: linear-gradient(135deg, rgba(228,193,122,.12), rgba(255,255,255,.035));
            border: 1px solid var(--line);
            color: var(--gold);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 999px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .nav-btn:hover {
            background: var(--gold);
            color: #0b0a10;
        }

        /* Gallery Grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .media-card {
            background: linear-gradient(135deg, rgba(228,193,122,.12), rgba(255,255,255,.035));
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 10px;
            box-shadow: 0 9px 28px rgba(0, 0, 0, .2);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .media-card video, .media-card img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            background: #000;
        }
        .media-title {
            margin-top: 12px;
            font-size: 16px;
            font-weight: bold;
            color: var(--muted);
            text-align: center;
        }

        footer {
            text-align: center;
            color: #aaa3b1;
            font-size: 13px;
            margin-top: 50px;
        }
        
        @media(max-width: 440px) {
            main { padding: 30px 15px 55px; }
            h1 { font-size: 26px; }
        }
    </style>
</head>
<body>
    <main>
        <div class="top"></div>
        <header>
            <h1>معرض الأعمال</h1>
            <p class="tag">الفكرة أولاً.. الذكاء الاصطناعي ثانياً.. واللمسة البشرية دائماً</p>
        </header>

        <div class="nav-links">
            <a href="index.html" class="nav-btn">العودة لقائمة الأسعار</a>
        </div>

        <section class="gallery">
            <!-- Project 1 -->
            <article class="media-card">
                <video src="project1.mp4" controls preload="metadata"></video>
                <div class="media-title">مشروع 1</div>
            </article>

            <!-- Project 2 -->
            <article class="media-card">
                <video src="project2.mp4" controls preload="metadata"></video>
                <div class="media-title">مشروع 2</div>
            </article>

            <!-- Project 3 (Image) -->
            <article class="media-card">
                <img src="project3.jpg" alt="تصميم مشروع 3">
                <div class="media-title">مشروع 3</div>
            </article>

            <!-- Project 4 -->
            <article class="media-card">
                <video src="project4.mp4" controls preload="metadata"></video>
                <div class="media-title">مشروع 4</div>
            </article>

            <!-- Project 5 -->
            <article class="media-card">
                <video src="project5.mp4" controls preload="metadata"></video>
                <div class="media-title">مشروع 5</div>
            </article>

            <!-- Project 8 -->
            <article class="media-card">
                <video src="project8.mp4" controls preload="metadata"></video>
                <div class="media-title">مشروع 8</div>
            </article>
        </section>

        <footer>
            <p>Creative Direction & AI Storytelling by Younan Sefien</p>
        </footer>
    </main>
</body>
</html>
