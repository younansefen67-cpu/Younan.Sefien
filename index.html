<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOUNAN SEFIEN — قائمة الأسعار</title>
<style>
  @font-face {
    font-family: 'Cairo';
    src: local('Cairo');
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Cairo', 'Segoe UI', sans-serif;
    background: #0a0a0e;
    color: #f5f5f5;
    min-height: 100vh;
  }
  body {
    background:
      radial-gradient(600px 500px at 15% 10%, rgba(212,175,100,0.20), transparent 60%),
      radial-gradient(600px 500px at 90% 30%, rgba(140,110,220,0.14), transparent 60%),
      radial-gradient(700px 600px at 80% 90%, rgba(212,175,100,0.16), transparent 60%),
      linear-gradient(180deg, #1c1620 0%, #0e0e14 45%, #08080c 100%);
    background-attachment: fixed;
    padding: 48px 20px 80px;
  }
  .wrap {
    max-width: 620px;
    margin: 0 auto;
  }
  .topbar {
    height: 4px;
    background: linear-gradient(90deg, transparent, #d4af64, transparent);
    margin-bottom: 40px;
    border-radius: 4px;
  }
  header {
    text-align: center;
    margin-bottom: 36px;
  }
  header img {
    width: 150px;
    filter: drop-shadow(0 8px 20px rgba(212,175,100,0.35));
    margin-bottom: 6px;
  }
  .tagline {
    color: #c9a566;
    font-size: 15px;
    letter-spacing: 0.3px;
    margin-bottom: 26px;
  }
  .divider {
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(212,175,100,0.6), transparent);
    margin: 0 auto 26px;
    width: 90%;
  }
  h1 {
    font-size: 28px;
    font-weight: 800;
    color: #e4c17a;
    text-align: center;
    margin: 0 0 6px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .sub-en {
    text-align: center;
    color: #a9a9b4;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .hint {
    text-align: center;
    color: #8f8f9a;
    font-size: 13.5px;
    margin-bottom: 34px;
  }
  .cards {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    border-radius: 20px;
    padding: 2px;
    background: linear-gradient(135deg, rgba(212,175,100,0.35), rgba(255,255,255,0.06));
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  .card:active { transform: scale(0.98); }
  .card:hover {
    box-shadow: 0 10px 30px rgba(212,175,100,0.18);
  }
  .card-inner {
    display: flex;
    align-items: center;
    gap: 18px;
    background: rgba(255,255,255,0.055);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border-radius: 18px;
    padding: 20px 22px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .badge {
    flex: 0 0 auto;
    width: 78px; height: 78px;
    border-radius: 50%;
    border: 2px solid #d4af64;
    background: rgba(10,10,14,0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }
  .badge .price {
    font-size: 21px;
    font-weight: 800;
    color: #fff;
    line-height: 1.1;
  }
  .badge .currency {
    font-size: 11.5px;
    color: #c9a566;
    margin-top: 2px;
  }
  .text { flex: 1 1 auto; text-align: right; }
  .title {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .sub {
    font-size: 13.5px;
    color: #bdbdc6;
  }
  .note {
    font-size: 12px;
    color: #c9a566;
    margin-top: 5px;
  }
  .cta-icon {
    flex: 0 0 auto;
    width: 42px; height: 42px;
    border-radius: 50%;
    background: rgba(37,211,102,0.12);
    display: flex; align-items: center; justify-content: center;
  }
  footer {
    text-align: center;
    margin-top: 46px;
    color: #8f8f9a;
    font-size: 13px;
  }
  footer .phone {
    color: #d4af64;
    font-weight: 700;
    font-size: 17px;
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }
  footer .line {
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(212,175,100,0.5), transparent);
    width: 80%;
    margin: 0 auto 24px;
  }
  .navtabs {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 34px;
  }
  .navtabs a {
    text-decoration: none;
    color: #cfcfd6;
    font-size: 14.5px;
    font-weight: 600;
    padding: 11px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    transition: all 0.2s ease;
  }
  .navtabs a.active {
    color: #1a1610;
    background: linear-gradient(135deg, #e8c987, #c9a566);
    border-color: transparent;
    box-shadow: 0 6px 18px rgba(212,175,100,0.35);
  }
</style>
</head>
